[project]
name = "infinisplat"
version = "0.1.2"
description = "Generate 3D Gaussian splats from images with InfiniSplat. Gaussian splatting / 3DGS for ComfyUI with native 3D preview, PLY export, batches, and optional camera calibration."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["infinisplat", "gaussian-splatting", "gaussian-splats", "3dgs", "3d", "image-to-3d", "single-image-reconstruction", "ply", "comfyui"]
license = { file = "LICENSE" }
dependencies = ["numpy", "Pillow"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Environment :: GPU :: NVIDIA CUDA",
]

[project.urls]
Repository = "https://github.com/jKaarlehto/ComfyUI-InfiniSplat"
"Bug Tracker" = "https://github.com/jKaarlehto/ComfyUI-InfiniSplat/issues"

[tool.comfy]
PublisherId = "jkaa"
DisplayName = "InfiniSplat - 3D Gaussian Splatting"
requires-comfyui = ">=0.39.2"


Icon = "https://raw.githubusercontent.com/jKaarlehto/ComfyUI-InfiniSplat/main/icon.png"
